name: AzurePipelines_Build_Deploy

on:
  push:
    branches:
      - azurePipelines

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  IMAGE_NAME: fraud-detector
  RESOURCE_GROUP: mlopsv2
  AML_WORKSPACE: mlopsV2
  CLUSTER_NAME: fraudAKSCluster
  DEPLOYMENT_NAME: fraud-backend
  CONTAINER_NAME: fraud-detector
  NAMESPACE: default
  AML_TRAIN_DATA_ASSET: azureml:cleaned_train_v2:1

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 📝 Validate and convert files to UTF-8
        run: |
          pip install chardet
          python src/convert_to_utf8.py

      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Submit Azure ML pipeline job
        run: |
          az ml job create --file deployment/pipeline-job.yaml \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.AML_WORKSPACE }} \
            --set display_name=train-autoencoder
        shell: bash

      - name: Wait for pipeline completion
        run: |
          JOB_ID=$(az ml job list --workspace-name ${{ env.AML_WORKSPACE }} --resource-group ${{ env.RESOURCE_GROUP }} --query "[?display_name=='train-autoencoder'] | [0].name" -o tsv)
          echo "Waiting for job $JOB_ID to complete..."
          STATUS=""
          for i in {1..60}; do
            STATUS=$(az ml job show --name $JOB_ID --workspace-name ${{ env.AML_WORKSPACE }} --resource-group ${{ env.RESOURCE_GROUP }} --query status -o tsv)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Completed" ]]; then
              echo "Job completed successfully."
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Canceled" ]]; then
              echo "Job failed or was canceled."
              exit 1
            fi
            sleep 30
          done
          echo "Timeout waiting for job to complete."
          exit 1
        shell: bash

      - name: Download model artifacts from train_autoencoder_component
        run: |
          JOB_ID=$(az ml job list --workspace-name ${{ env.AML_WORKSPACE }} --resource-group ${{ env.RESOURCE_GROUP }} --query "[?display_name=='train-autoencoder'] | [0].name" -o tsv)
          az ml job download --name $JOB_ID --output-name model_dir --download-path ./models --resource-group ${{ env.RESOURCE_GROUP }} --workspace-name ${{ env.AML_WORKSPACE }}
          if [ ! -d "./models" ] || [ -z "$(ls -A ./models)" ]; then
            echo "Model artifacts not found! Failing the build."
            exit 1
          fi
        shell: bash

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: ./models

  build-images:
    runs-on: ubuntu-latest
    needs: ml-pipeline
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ./models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push backend Docker image
        run: |
          set -e
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:autoencoder
          docker buildx build --platform=linux/arm64 -f deployment/Dockerfile -t $IMAGE_TAG . --push
        continue-on-error: false

      - name: Build and push frontend Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest
          docker buildx build --platform=linux/arm64 -t $IMAGE_TAG -f frontend/Dockerfile frontend --push

  deploy-aks:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          resource-group: ${{ env.RESOURCE_GROUP }}

      - name: Apply all Kubernetes manifests
        run: |
          chmod +x scripts/apply_all_k8s.sh
          scripts/apply_all_k8s.sh

      - name: Update backend deployment image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:autoencoder
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.CONTAINER_NAME }}=$IMAGE_TAG --namespace ${{ env.NAMESPACE }}

      - name: Update frontend deployment image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest
          kubectl set image deployment/frontend nginx=$IMAGE_TAG --namespace ${{ env.NAMESPACE }}

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --namespace ${{ env.NAMESPACE }} --timeout=180s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --namespace ${{ env.NAMESPACE }} --timeout=180s

      - name: Deployment summary
        run: |
          kubectl get pods --namespace ${{ env.NAMESPACE }}
          kubectl get svc --namespace ${{ env.NAMESPACE }}
          kubectl get ingress --namespace ${{ env.NAMESPACE }}


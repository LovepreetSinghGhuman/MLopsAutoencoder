trigger: none  # Only run when triggered by GitHub Actions

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.9'

  - script: |
      pip install --upgrade pip
      pip install azure-cli
      az version
      az extension add -n ml -y --upgrade
    displayName: 'Install Azure CLI and ML extension'

  - script: |
      JOB_ID=$(az ml job create --file deployment/train-job.yaml --resource-group $(RESOURCE_GROUP) --workspace-name $(AML_WORKSPACE) --query name -o tsv)
      echo "##vso[task.setvariable variable=JOB_ID]$JOB_ID"
    displayName: 'Submit Azure ML training job'

  - script: |
      az ml job download --name $(JOB_ID) --resource-group $(RESOURCE_GROUP) --workspace-name $(AML_WORKSPACE) --output ./models --all
    displayName: 'Download model artifacts from Azure ML job'

  - publish: $(System.DefaultWorkingDirectory)/models
    artifact: trained-model
    displayName: 'Publish trained model artifact'

  - script: |
      az ml model create --name fraud-autoencoder \
        --path ./models \
        --type custom_model \
        --resource-group $(RESOURCE_GROUP) \
        --workspace-name $(AML_WORKSPACE)
    displayName: 'Register trained model in Azure ML'
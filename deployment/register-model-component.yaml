$schema: https://azuremlschemas.azureedge.net/latest/component.schema.json
name: register_model
version: 9
type: command
inputs:
  model_path:
    type: uri_folder
    description: Path to model artifacts
  model_name:
    type: string
    description: Name for registered model
outputs: {}
code: .
command: >-
  echo "Listing model_path contents:" &&
  ls -R ${{inputs.model_path}} &&
  az ml model create --name ${{inputs.model_name}} --path ${{inputs.model_path}} --resource-group mlopsv2 --workspace-name mlopsV2
environment:
  conda_file: conda.yaml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
description: Register model in Azure ML workspace using CLI.
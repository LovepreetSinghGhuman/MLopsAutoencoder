# Azure Pipelines YAML for model training and artifact publishing
# This pipeline trains the model on Azure ML and publishes model artifacts for GitHub Actions

trigger:
  branches:
    include:
      - main
      - azurePipelines

pool:
  vmImage: 'ubuntu-latest'

variables:
  RESOURCE_GROUP: 'mlopsv2'
  AML_WORKSPACE: 'mlopsV2'
  TRAIN_JOB_FILE: 'deployment/train-job.yaml'
  DISPLAY_NAME: 'train-autoencoder'
  ARTIFACT_PATH: 'outputs'

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

- script: |
    pip install azure-ai-ml
    az extension add -n ml -y
  displayName: 'Install Azure ML CLI'

- script: |
    az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
  displayName: 'Azure Login'
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- script: |
    az ml job create --file $(TRAIN_JOB_FILE) \
      --resource-group $(RESOURCE_GROUP) \
      --workspace-name $(AML_WORKSPACE) \
      --set display_name=$(DISPLAY_NAME)
  displayName: 'Submit Azure ML Training Job'

- script: |
    JOB_ID=$(az ml job list --workspace-name $(AML_WORKSPACE) --resource-group $(RESOURCE_GROUP) --query "[?display_name=='$(DISPLAY_NAME)' && status=='Completed'] | [0].name" -o tsv)
    echo "##vso[task.setvariable variable=JOB_ID]$JOB_ID"
  displayName: 'Get Latest Completed Job ID'

- script: |
    az ml job download --name $(JOB_ID) --resource-group $(RESOURCE_GROUP) --workspace-name $(AML_WORKSPACE) --download-path $(Build.ArtifactStagingDirectory)/model --all
  displayName: 'Download Model Artifacts'

- publish: $(Build.ArtifactStagingDirectory)/model
  artifact: model
  displayName: 'Publish Model Artifacts'
